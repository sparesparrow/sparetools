name: ESP32 Build (Reusable)

on:
  workflow_call:
    inputs:
      conan_packages:
        description: 'Conan packages to install (comma-separated)'
        required: false
        default: 'sparesparrow-protocols/1.0.0,sparetools-embedded/1.0.0'
        type: string
      board_type:
        description: 'ESP32 board type'
        required: false
        default: 'esp32dev'
        type: string
      environment:
        description: 'PlatformIO environment'
        required: false
        default: 'esp32dev'
        type: string
      run_tests:
        description: 'Run unit tests'
        required: false
        default: true
        type: boolean
    secrets:
      CLOUDSMITH_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Conan
      uses: turtlebrowser/get-conan@v1.2

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Configure Conan remotes
      run: |
        conan remote add conancenter https://center.conan.io
        conan remote add sparesparrow-conan https://conan.cloudsmith.io/sparesparrow/
        if [ -n "${{ secrets.CLOUDSMITH_API_KEY }}" ]; then
          conan remote auth sparesparrow-conan ${{ secrets.CLOUDSMITH_API_KEY }}
        fi

    - name: Cache PlatformIO dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          platformio-${{ runner.os }}-

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
        restore-keys: |
          conan-${{ runner.os }}-

    - name: Install Conan dependencies
      run: |
        # Convert comma-separated packages to space-separated for conan install
        PACKAGES="${{ inputs.conan_packages }}"
        PACKAGES="${PACKAGES//,/ }"
        echo "Installing packages: $PACKAGES"
        conan install $PACKAGES --build=missing --generator=CMakeDeps

    - name: Build ESP32 firmware
      run: |
        platformio run --environment ${{ inputs.environment }}

    - name: Run tests
      if: inputs.run_tests
      run: |
        platformio test --environment test

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: esp32-firmware-${{ inputs.board_type }}
        path: |
          .pio/build/${{ inputs.environment }}/
          !.pio/build/${{ inputs.environment }}/*.elf

    - name: Upload test results
      if: inputs.run_tests && failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ inputs.board_type }}
        path: |
          .pio/test_results/
          test-results.xml



