name: Conan Publish

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Package name to publish'
        required: true
        type: string
      package_version:
        description: 'Package version'
        required: true
        type: string
      conanfile_path:
        description: 'Path to conanfile.py'
        required: true
        type: string
      profile:
        description: 'Conan profile to use'
        required: false
        default: 'default'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Conan
      uses: turtlebrowser/get-conan@v1.2

    - name: Configure Conan remote
      run: |
        conan remote add sparesparrow https://conan.cloudsmith.io/sparesparrow/
        conan remote auth sparesparrow ${{ secrets.CLOUDSMITH_API_KEY }}

    - name: Create package
      run: |
        conan create ${{ inputs.conanfile_path }} \
          ${{ inputs.package_name }}/${{ inputs.package_version }} \
          --profile ${{ inputs.profile }} \
          --build missing

    - name: Upload package
      run: |
        conan upload ${{ inputs.package_name }}/${{ inputs.package_version }}@sparesparrow/stable \
          --remote sparesparrow \
          --all

    - name: Verify upload
      run: |
        conan search ${{ inputs.package_name }}/${{ inputs.package_version }}@sparesparrow/stable \
          --remote sparesparrow