name: ESP32 Build

on:
  workflow_call:
    inputs:
      conan_packages:
        description: 'Conan packages to install'
        required: false
        default: 'sparesparrow-protocols/1.0.0@sparesparrow/stable'
        type: string
      esp32_board:
        description: 'ESP32 board variant'
        required: false
        default: 'esp32dev'
        type: string
      platformio_env:
        description: 'PlatformIO environment name'
        required: false
        default: 'esp32dev'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Conan
      uses: turtlebrowser/get-conan@v1.2

    - name: Setup PlatformIO
      uses: arduino/setup-protoc@v2
      with:
        version: '3.19.4'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Configure Conan remote
      run: |
        conan remote add sparesparrow https://conan.cloudsmith.io/sparesparrow/
        conan remote auth sparesparrow ${{ secrets.CLOUDSMITH_API_KEY }}

    - name: Create Conan profile for ESP32
      run: |
        conan profile new esp32 --detect
        conan profile update settings.os=baremetal esp32
        conan profile update settings.arch=xtensa esp32
        conan profile update settings.compiler=gcc esp32
        conan profile update settings.compiler.version=11 esp32
        conan profile update settings.compiler.libcxx=libstdc++11 esp32

    - name: Install dependencies
      run: |
        conan install ${{ inputs.conan_packages }} \
          --profile esp32 \
          --build missing \
          --generator PlatformioBuild

    - name: Build with PlatformIO
      run: |
        pio run -e ${{ inputs.platformio_env }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: esp32-firmware
        path: .pio/build/${{ inputs.platformio_env }}/firmware.bin