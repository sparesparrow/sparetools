name: FlatBuffers Schema Validation (Reusable)

on:
  workflow_call:
    inputs:
      schema_package_path:
        description: 'Path to package containing FlatBuffers schemas'
        required: false
        default: 'packages/foundation/sparetools-protocols'
        type: string
      validate_syntax:
        description: 'Validate FlatBuffers schema syntax'
        required: false
        default: true
        type: boolean
      validate_compatibility:
        description: 'Check schema compatibility and breaking changes'
        required: false
        default: true
        type: boolean
      generate_code:
        description: 'Generate and validate code compilation'
        required: false
        default: true
        type: boolean
      target_platforms:
        description: 'Platforms to validate against (comma-separated)'
        required: false
        default: 'linux-x86_64'
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: false

jobs:
  validate-schemas:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for change detection

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Conan
      uses: turtlebrowser/get-conan@v1.2

    - name: Setup Node.js for schema validation tools
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configure Conan remotes
      run: |
        conan remote add conancenter https://center.conan.io
        conan remote add sparesparrow-conan https://conan.cloudsmith.io/sparesparrow/
        if [ -n "${{ secrets.CLOUDSMITH_API_KEY }}" ]; then
          conan remote auth sparesparrow-conan ${{ secrets.CLOUDSMITH_API_KEY }}
        fi

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-

    - name: Install FlatBuffers validation tools
      run: |
        npm install -g flatbuffers-validator
        pip install flatbuffers

    - name: Validate FlatBuffers schema syntax
      if: inputs.validate_syntax
      run: |
        echo "Validating FlatBuffers schema syntax..."
        find ${{ inputs.schema_package_path }}/schemas -name "*.fbs" -exec flatbuffers-validator {} \;

    - name: Check for schema changes
      id: schema_changes
      run: |
        # Get changed schema files
        CHANGED_SCHEMAS=$(git diff --name-only HEAD~1 | grep "\.fbs$" | tr '\n' ' ')
        echo "changed_schemas=$CHANGED_SCHEMAS" >> $GITHUB_OUTPUT

        # Check if any root types changed
        if [ -n "$CHANGED_SCHEMAS" ]; then
          echo "Schemas changed, checking for breaking changes..."
          # Extract root_type declarations from changed files
          for schema in $CHANGED_SCHEMAS; do
            if [ -f "$schema" ]; then
              ROOT_TYPES=$(grep "root_type" "$schema" | wc -l)
              echo "Schema $schema has $ROOT_TYPES root types"
            fi
          done
        fi

    - name: Build schema package
      run: |
        cd ${{ inputs.schema_package_path }}
        conan create . --build=missing --profile=linux-x86_64

    - name: Generate code for validation
      if: inputs.generate_code
      run: |
        echo "Generating FlatBuffers code for compilation validation..."

        # Create test generation directory
        mkdir -p fb_validation_test
        cd fb_validation_test

        # Install schema package for testing
        conan install sparetools-protocols/1.0.0 --build=missing

        # Get schema directory
        SCHEMA_DIR=$(conan info sparetools-protocols/1.0.0 --paths | grep "schemas:" | cut -d' ' -f2)
        if [ -z "$SCHEMA_DIR" ]; then
          # Fallback: find schema directory
          SCHEMA_DIR=$(find ~/.conan2 -name "sparetools-protocols" -type d | head -1)/schemas
        fi

        echo "Schema directory: $SCHEMA_DIR"

        # Generate test code for each schema
        find "$SCHEMA_DIR" -name "*.fbs" | while read schema; do
          echo "Generating code for $(basename "$schema")"
          flatc --cpp --gen-mutable -o generated "$schema" || exit 1
        done

        # Create simple test program
        cat > test_fb.cpp << 'EOF'
#include <iostream>
#include <flatbuffers/flatbuffers.h>

// Include a few generated headers for compilation test
#include "generated/common_generated.h"
#include "generated/BPM_generated.h"

int main() {
    // Test basic FlatBuffers functionality
    flatbuffers::FlatBufferBuilder builder;

    // Create a simple response
    auto response = sparetools::common::CreateResponse(
        builder,
        sparetools::common::Status_OK,
        builder.CreateString("Test response"),
        1234567890ULL,
        1ULL
    );
    builder.Finish(response);

    std::cout << "FlatBuffers validation successful!" << std::endl;
    return 0;
}
EOF

        # Try to compile the test
        g++ -std=c++17 -Igenerated -I$(conan info flatbuffers/24.3.25 --paths | grep "include:" | cut -d' ' -f2) test_fb.cpp -o test_fb

        # Run the test
        ./test_fb

    - name: Validate cross-platform compatibility
      run: |
        echo "Validating cross-platform compatibility..."

        # Test different FlatBuffers targets
        TARGETS=("cpp" "python" "java" "csharp" "go" "typescript")

        mkdir -p cross_platform_test
        cd cross_platform_test

        # Install schema package
        conan install sparetools-protocols/1.0.0 --build=missing

        SCHEMA_DIR=$(find ~/.conan2 -name "sparetools-protocols" -type d | head -1)/schemas
        SAMPLE_SCHEMA="$SCHEMA_DIR/common/common.fbs"

        if [ -f "$SAMPLE_SCHEMA" ]; then
          for target in "${TARGETS[@]}"; do
            echo "Testing $target generation..."
            flatc --$target -o $target "$SAMPLE_SCHEMA" || echo "Warning: $target generation failed"
          done
        fi

    - name: Check schema compatibility
      if: inputs.validate_compatibility && steps.schema_changes.outputs.changed_schemas
      run: |
        echo "Checking schema compatibility for changed files..."
        CHANGED_SCHEMAS="${{ steps.schema_changes.outputs.changed_schemas }}"

        # Basic compatibility check - ensure schemas can be parsed
        for schema in $CHANGED_SCHEMAS; do
          if [ -f "$schema" ]; then
            echo "Checking compatibility for $schema"

            # Check for basic syntax issues that could break compatibility
            # Look for root_type changes, enum modifications, etc.

            # Count root types (should be stable)
            ROOT_COUNT=$(grep -c "root_type" "$schema")
            echo "Schema $schema has $ROOT_COUNT root types"

            # Check for enum changes that might break binary compatibility
            ENUM_CHANGES=$(git diff HEAD~1 "$schema" | grep "^[+-].*enum" | wc -l)
            if [ "$ENUM_CHANGES" -gt 0 ]; then
              echo "Warning: Enum changes detected in $schema - check binary compatibility"
            fi
          fi
        done

    - name: Upload validation artifacts
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: flatbuffers-validation-failures
        path: |
          fb_validation_test/
          cross_platform_test/
          *.log

    - name: Schema validation summary
      run: |
        echo "## FlatBuffers Schema Validation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Syntax validation: ${{ inputs.validate_syntax && 'Enabled' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Compatibility check: ${{ inputs.validate_compatibility && 'Enabled' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code generation: ${{ inputs.generate_code && 'Enabled' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Changed Schemas" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ steps.schema_changes.outputs.changed_schemas }}" ]; then
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.schema_changes.outputs.changed_schemas }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "No schema changes detected" >> $GITHUB_STEP_SUMMARY
        fi