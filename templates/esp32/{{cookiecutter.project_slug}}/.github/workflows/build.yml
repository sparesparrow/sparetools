name: ESP32 Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Install Conan
      run: |
        pip install conan

    - name: Configure Conan remotes
      run: |
        conan remote add sparetools https://cloudsmith.io/~sparesparrow/repos/sparetools/
        conan remote add conancenter https://center.conan.io

    - name: Cache PlatformIO dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          platformio-${{ runner.os }}-

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
        restore-keys: |
          conan-${{ runner.os }}-

    - name: Build ESP32 firmware
      run: |
        platformio run --environment {{cookiecutter.board_type}}

    - name: Run tests
      run: |
        platformio test --environment test

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: esp32-firmware
        path: |
          .pio/build/{{cookiecutter.board_type}}/
          !.pio/build/{{cookiecutter.board_type}}/*.elf



