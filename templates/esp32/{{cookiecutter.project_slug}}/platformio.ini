; PlatformIO Project Configuration File
;
; Generated from SpareTools ESP32 template
; Project: {{cookiecutter.project_name}}
; Author: {{cookiecutter.author}}

[platformio]
default_envs = {{cookiecutter.board_type}}
src_dir = src
include_dir = include
build_cache_dir = .pio/cache
core_dir = .platformio

; Global build flags
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DESP32
    -include limits.h
    -D PROJECT_NAME="{{cookiecutter.project_name}}"
    -D PROJECT_VERSION="{{cookiecutter.version}}"

; Global library dependencies
lib_deps =
{% if cookiecutter.include_display == 'y' %}
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
{% endif %}
{% if cookiecutter.include_wifi == 'y' %}
    me-no-dev/ESP Async WebServer @ ^1.2.3
{% endif %}
{% if cookiecutter.include_websocket == 'y' %}
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
{% endif %}

; Extra scripts for build process
extra_scripts =
    pre:scripts/conan_install.py

; Base environment configuration
[env]
platform = espressif32 @ ^6.4.0
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder, time
board_build.partitions = custom_partition.csv
build_type = release
upload_speed = 921600
board_build.filesystem = littlefs
board_upload.maximum_size = 1310720

; Debug build configuration
[env:debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DDEBUG
    -DCORE_DEBUG_LEVEL=5
    -g
    -O0

; Test build configuration
[env:test]
build_type = test
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    ${env.lib_deps}
    ArduinoFake

; ==========================================
; ESP32 Board Configurations
; ==========================================

; ESP32 DevKit V1
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -Ofast
    -D BOARD_NAME="esp32dev"

; ESP32-S3 DevKit
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -Ofast
    -D BOARD_NAME="esp32-s3-devkitc-1"

; ESP32-C3 DevKit
[env:esp32-c3-devkitc-02]
board = esp32-c3-devkitc-02
build_flags =
    ${env.build_flags}
    -Ofast
    -D BOARD_NAME="esp32-c3-devkitc-02"




