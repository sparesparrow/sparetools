name: Build Zipapps

# Build Python zipapps for SpareTools CLI tools
# Creates standalone .pyz files for distribution
# Expected duration: 2-5 minutes

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/build/zipapps.yaml'
      - 'scripts/build/build-zipapp.py'
      - 'scripts/build/build-zipapps-from-manifest.py'
      - 'bootstrap-obd.py'
      - 'scripts/**/*.py'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'scripts/build/zipapps.yaml'
      - 'scripts/build/build-zipapp.py'
      - 'scripts/build/build-zipapps-from-manifest.py'
      - 'bootstrap-obd.py'
      - 'scripts/**/*.py'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # For uploading artifacts

jobs:
  determine-mode:
    name: Determine Build Mode
    runs-on: ubuntu-latest
    outputs:
      is_production: ${{ steps.mode.outputs.is_production }}
      mode_description: ${{ steps.mode.outputs.mode_description }}

    steps:
      - name: Determine publishing mode
        id: mode
        run: |
          # Determine if this is a production build (releases)
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "mode_description=Production (release)" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "mode_description=Dry-run (${{ github.event_name }})" >> $GITHUB_OUTPUT
          fi

  build-zipapps:
    name: Build Zipapps
    needs: determine-mode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build all zipapps
        run: |
          echo "🏗️ Building SpareTools zipapps..."
          python scripts/build/build-zipapps-from-manifest.py -o dist

      - name: Verify zipapps
        run: |
          echo "🔍 Verifying built zipapps..."
          for pyz in dist/*.pyz; do
            echo "Testing $pyz..."
            python "$pyz" --help >/dev/null 2>&1 || echo "Warning: $pyz --help failed"
          done
          echo "✅ Verification complete"

      - name: List built zipapps
        run: |
          echo "📦 Built zipapps:"
          ls -lh dist/*.pyz
          echo "Total zipapps: $(ls dist/*.pyz | wc -l)"

      - name: Upload zipapp artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sparetools-zipapps
          path: dist/*.pyz
          retention-days: 30

      # Attach zipapps to releases (production only)
      - name: Upload zipapps to release
        if: needs.determine-mode.outputs.is_production == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pyz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Generate installation instructions
        run: |
          echo "## 📦 SpareTools Zipapps (${{ needs.determine-mode.outputs.mode_description }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built $(ls dist/*.pyz | wc -l) zipapps for distribution:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pyz in dist/*.pyz; do
            name=$(basename "$pyz" .pyz)
            size=$(du -h "$pyz" | cut -f1)
            echo "- **${name}** (${size})" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Example" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '# Download latest release and make executable' >> $GITHUB_STEP_SUMMARY
          echo 'curl -s https://api.github.com/repos/sparesparrow/sparetools/releases/latest | \' >> $GITHUB_STEP_SUMMARY
          echo '  sed -n "s/\"browser_download_url\": \"//p" | \' >> $GITHUB_STEP_SUMMARY
          echo '  grep "sparetools-.*\.pyz" | \' >> $GITHUB_STEP_SUMMARY
          echo '  head -1 | xargs wget -qO sparetools-tool.pyz' >> $GITHUB_STEP_SUMMARY
          echo 'chmod +x sparetools-tool.pyz' >> $GITHUB_STEP_SUMMARY
          echo '# Move to PATH' >> $GITHUB_STEP_SUMMARY
          echo 'sudo mv sparetools-tool.pyz /usr/local/bin/' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
