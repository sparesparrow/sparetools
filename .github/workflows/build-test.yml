name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CONAN_VERSION: "2.21.0"
  # Centralized version management
  VERSION_BASE: "2.0.0"
  VERSION_CPYTHON: "3.12.7"
  VERSION_OPENSSL: "3.3.2"

jobs:
  build-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1: Production-Critical
          - name: Linux-GCC11-Perl-Default
            os: ubuntu-22.04
            base_profile: base/linux-gcc11
            method_profile: build-methods/perl-configure
            feature_profile: ""
            package: sparetools-openssl
          
          - name: Linux-GCC11-Perl-FIPS
            os: ubuntu-22.04
            base_profile: base/linux-gcc11
            method_profile: build-methods/perl-configure
            feature_profile: features/fips-enabled
            package: sparetools-openssl
          
          - name: Linux-Clang14-Perl-Default
            os: ubuntu-22.04
            base_profile: base/linux-clang14
            method_profile: build-methods/perl-configure
            feature_profile: ""
            package: sparetools-openssl
          
          - name: Windows-MSVC2022-Perl-Default
            os: windows-2022
            base_profile: base/windows-msvc2022
            method_profile: build-methods/perl-configure
            feature_profile: ""
            package: sparetools-openssl
          
          - name: macOS-ARM64-Perl-Default
            os: macos-14
            base_profile: base/darwin-clang-arm64
            method_profile: build-methods/perl-configure
            feature_profile: ""
            package: sparetools-openssl
          
          # Base Packages
          - name: sparetools-base
            os: ubuntu-22.04
            base_profile: ""
            package: sparetools-base
          
          - name: sparetools-cpython
            os: ubuntu-22.04
            base_profile: ""
            package: sparetools-cpython
          
          - name: sparetools-shared-dev-tools
            os: ubuntu-22.04
            base_profile: ""
            package: sparetools-shared-dev-tools
          
          - name: sparetools-bootstrap
            os: ubuntu-22.04
            base_profile: ""
            package: sparetools-bootstrap
          
          - name: sparetools-openssl-tools
            os: ubuntu-22.04
            base_profile: ""
            package: sparetools-openssl-tools
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Conan
        run: |
          pip install conan==2.21.0
          conan --version
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Cache Conan artifacts
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.os }}-${{ matrix.package }}-${{ hashFiles('packages/**/conanfile.py', 'packages/sparetools-openssl-tools/profiles/**') }}
          restore-keys: |
            conan-${{ matrix.os }}-${{ matrix.package }}-
            conan-${{ matrix.os }}-
            conan-
      
      - name: Export Foundation Packages
        if: matrix.base_profile != ''
        run: |
          echo "📦 Exporting foundation packages..."
          set -e
          
          # Export foundation packages first (required dependencies)
          echo "Exporting sparetools-base..."
          conan export packages/sparetools-base --version=${{ env.VERSION_BASE }}
          
          echo "Exporting sparetools-openssl-tools..."
          conan export packages/sparetools-openssl-tools --version=${{ env.VERSION_BASE }}
          
          echo "Exporting sparetools-shared-dev-tools..."
          conan export packages/sparetools-shared-dev-tools --version=${{ env.VERSION_BASE }}
          
          # Export CPython recipe (needed for tool_requires resolution)
          echo "Exporting sparetools-cpython recipe..."
          conan export packages/sparetools-cpython --version=${{ env.VERSION_CPYTHON }}
          
          # Check if CPython binary exists, if not Conan will build it with --build=missing
          echo "🐍 Checking for CPython binary..."
          if conan list "sparetools-cpython/${{ env.VERSION_CPYTHON }}:*" >/dev/null 2>&1; then
            echo "✅ CPython binary already available"
          else
            echo "ℹ️  CPython binary not found - will be built with --build=missing"
          fi
          
          echo "✅ Foundation packages ready"
        shell: bash
      
      - name: Build Package (With Profiles)
        if: matrix.base_profile != ''
        run: |
          # Use centralized version management
          if [ "${{ matrix.package }}" == "sparetools-openssl" ]; then
            VERSION="${{ env.VERSION_OPENSSL }}"
          else
            VERSION="${{ env.VERSION_BASE }}"
          fi

          # Install CPython and shared-dev-tools via Conan
          # VirtualRunEnv will set up PATH and PYTHONPATH correctly
          conan install --requires=sparetools-cpython/${{ env.VERSION_CPYTHON }} --requires=sparetools-shared-dev-tools/${{ env.VERSION_BASE }} --build=missing -g VirtualRunEnv
          
          # Source Conan environment to get CPython and shared-dev-tools in PYTHONPATH
          source conanrun.sh
          
          # Build profile arguments using shared-dev-tools utilities (via CPython from Conan)
          if [ -n "${{ matrix.feature_profile }}" ]; then
            PROFILES=$(python3 packages/sparetools-shared-dev-tools/scripts/build_profile_args.py "${{ matrix.base_profile }}" "${{ matrix.method_profile }}" "${{ matrix.feature_profile }}")
          else
            PROFILES=$(python3 packages/sparetools-shared-dev-tools/scripts/build_profile_args.py "${{ matrix.base_profile }}" "${{ matrix.method_profile }}")
          fi
          
          conan create packages/${{ matrix.package }} --version=$VERSION $PROFILES --build=missing
        shell: bash
      
      - name: Export Base Dependency (Simple)
        if: matrix.base_profile == '' && matrix.package != 'sparetools-base'
        run: |
          echo "📦 Exporting sparetools-base (required dependency)..."
          conan export packages/sparetools-base --version=${{ env.VERSION_BASE }}
          echo "✅ sparetools-base exported"
        shell: bash
      
      - name: Build Package (Simple)
        if: matrix.base_profile == ''
        run: |
          # Use centralized version management
          if [ "${{ matrix.package }}" == "sparetools-cpython" ]; then
            VERSION="${{ env.VERSION_CPYTHON }}"
          else
            VERSION="${{ env.VERSION_BASE }}"
          fi

          if [ "${{ matrix.package }}" == "sparetools-base" ]; then
            # sparetools-base has no dependencies, just export
            conan export packages/${{ matrix.package }} --version=$VERSION
          elif [ "${{ matrix.package }}" == "sparetools-shared-dev-tools" ] || \
               [ "${{ matrix.package }}" == "sparetools-bootstrap" ] || \
               [ "${{ matrix.package }}" == "sparetools-openssl-tools" ]; then
            # These need sparetools-base (already exported in previous step)
            conan export packages/${{ matrix.package }} --version=$VERSION
          else
            # sparetools-cpython needs sparetools-base (already exported)
            conan create packages/${{ matrix.package }} --version=$VERSION --build=missing
          fi
        shell: bash
      
      - name: Test Package
        if: matrix.package == 'sparetools-openssl'
        run: |
          # ✅ Conan 2.x syntax
          conan test packages/sparetools-openssl/test_package \
            --requires=sparetools-openssl/${{ env.VERSION_OPENSSL }}
      
      - name: Upload Build Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          path: |
            ~/.conan2/p/*/b/*/build.log
            ~/.conan2/p/*/b/*/test.log

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()
    steps:
      - name: Check Build Status
        run: |
          if [ "${{ needs.build-matrix.result }}" == "success" ]; then
            echo "✅ All builds passed successfully!"
          else
            echo "❌ Some builds failed. Check the logs above."
            exit 1
          fi

