name: Validate Secrets

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # For creating issues on validation failures

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js for NPM validation
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.21.0

      - name: Test Cloudsmith API Key
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          echo "🔑 Testing Cloudsmith API Key..."

          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "❌ CLOUDSMITH_API_KEY secret not configured"
            exit 1
          fi

          # Configure Conan remote
          conan remote add test-cloudsmith https://conan.cloudsmith.io/sparesparrow/ --force
          conan remote login test-cloudsmith spare-sparrow --password "$CLOUDSMITH_API_KEY"

          # Test authentication by listing packages
          if conan list "sparetools-*/*" -r test-cloudsmith >/dev/null 2>&1; then
            echo "✅ Cloudsmith API Key is valid"
          else
            echo "❌ Cloudsmith API Key authentication failed"
            exit 1
          fi

      - name: Test NPM Token (if configured)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "📦 Testing NPM Token..."

          if [ -z "$NPM_TOKEN" ]; then
            echo "⚠️  NPM_TOKEN secret not configured (optional)"
            exit 0
          fi

          # Configure npm with token
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

          # Test authentication
          if npm whoami >/dev/null 2>&1; then
            echo "✅ NPM Token is valid"
          else
            echo "❌ NPM Token authentication failed"
            exit 1
          fi

      - name: Test DockerHub Credentials (if configured)
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "🐳 Testing DockerHub Credentials..."

          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASS" ]; then
            echo "⚠️  DockerHub credentials not fully configured (optional)"
            exit 0
          fi

          # Test authentication
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

          if [ $? -eq 0 ]; then
            echo "✅ DockerHub credentials are valid"
          else
            echo "❌ DockerHub authentication failed"
            exit 1
          fi

      - name: Test GitHub Packages Token
        run: |
          echo "📦 Testing GitHub Packages Token..."

          # Test if we can authenticate with GitHub Packages
          conan remote add test-github \
            https://maven.pkg.github.com/${{ github.repository_owner }}/sparetools \
            --force || true

          conan remote login test-github ${{ github.actor }} --password "${{ secrets.GITHUB_TOKEN }}"

          # Try to list packages (may not exist yet, but tests auth)
          if conan list "sparetools-*/*" -r test-github >/dev/null 2>&1; then
            echo "✅ GitHub Packages token is valid"
          else
            echo "⚠️  GitHub Packages authentication may have issues (this is expected if no packages exist yet)"
          fi

      - name: Generate validation report
        run: |
          echo "## 🔐 Secrets Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Weekly validation of CI/CD credentials and tokens." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudsmith API | ${{ job.status == 'success' && '✅ Valid' || '❌ Invalid' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Token | ${{ env.NPM_TOKEN && job.status == 'success' && '✅ Valid' || '⚠️ Not configured' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DockerHub | ${{ env.DOCKER_USER && env.DOCKER_PASS && job.status == 'success' && '✅ Valid' || '⚠️ Not configured' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Packages | ${{ job.status == 'success' && '✅ Valid' || '❌ Invalid' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ All configured secrets are valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some secrets validation failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs and update the failing secrets." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issue on validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔐 CI/CD Secrets Validation Failed',
              body: `
              ## 🔐 Secrets Validation Failure

              The weekly secrets validation has detected issues with one or more CI/CD credentials:

              ### Failed Validations
              - ❌ **Cloudsmith API Key**: Authentication failed
              - ❌ **NPM Token**: Authentication failed (if configured)
              - ❌ **DockerHub Credentials**: Authentication failed (if configured)
              - ❌ **GitHub Packages Token**: Authentication failed

              ### Required Actions
              1. Check repository secrets in Settings → Secrets and variables → Actions
              2. Regenerate expired tokens if necessary
              3. Update DockerHub credentials if changed
              4. Verify Cloudsmith API key permissions

              ### Impact
              This will prevent package publishing and deployment workflows from functioning correctly.

              ---
              *This issue was automatically created by the secrets validation workflow.*
              `,
              labels: ['security', 'ci-cd', 'urgent']
            })

      - name: Send notification on failure
        if: failure()
        run: |
          echo "🚨 Secrets validation failed - check repository secrets"
          # Could add Slack/Discord notification here if configured