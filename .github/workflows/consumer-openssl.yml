name: Consumer CI/CD - OpenSSL

# OpenSSL Consumer CI/CD workflow
# Handles build, test, security, and deployment for OpenSSL packages

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/consumers/openssl/**'
      - '.consumer.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/consumers/openssl/**'
      - '.consumer.yaml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to build (leave empty for all)'
        required: false
      environment:
        description: 'Target environment'
        required: false
        default: 'development'
        options: ['development', 'staging', 'production']

env:
  CONAN_VERSION: "2.21.0"
  PYTHON_VERSION: "3.12"
  CONSUMER_NAME: "openssl"

jobs:
  # Consumer validation job
  validate-consumer:
    name: Validate OpenSSL Consumer
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.validate.outputs.packages }}
      has_changes: ${{ steps.validate.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate consumer configuration
        id: validate
        run: |
          # Check consumer configuration
          if [ ! -f "packages/consumers/${{ env.CONSUMER_NAME }}/.consumer.yaml" ]; then
            echo "❌ Consumer configuration not found"
            exit 1
          fi

          # Extract package list
          PACKAGES=$(python -c "
          import yaml
          with open('packages/consumers/${{ env.CONSUMER_NAME }}/.consumer.yaml') as f:
              config = yaml.safe_load(f)
          packages = config.get('packages', [])
          print(','.join(packages))
          ")

          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "✅ Consumer validation passed - packages: $PACKAGES"

          # Check if there are actual changes to consumer packages
          if git diff --name-only HEAD~1 | grep -q "packages/consumers/${{ env.CONSUMER_NAME }}"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # Build consumer packages
  build-consumer:
    name: Build OpenSSL Packages
    needs: validate-consumer
    if: needs.validate-consumer.outputs.has_changes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [sparetools-openssl, sparetools-openssl-tools]

    env:
      CONAN_HOME: ~/.conan2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: Configure Conan
        run: |
          conan profile detect --force
          conan remote add sparesparrow-conan \
            https://dl.cloudsmith.io/public/sparesparrow-conan/openssl-conan/conan/ \
            --force || true

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.os }}-${{ env.CONSUMER_NAME }}-${{ matrix.package }}-${{ hashFiles(format('packages/consumers/{0}/{1}/conanfile.py', env.CONSUMER_NAME, matrix.package)) }}
          restore-keys: |
            conan-${{ matrix.os }}-${{ env.CONSUMER_NAME }}-
            conan-${{ matrix.os }}-

      - name: Build consumer package
        run: |
          echo "Building ${{ env.CONSUMER_NAME }}/${{ matrix.package }} on ${{ matrix.os }}"

          # Record build start
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

          # Build the specific package
          python scripts/build/build-orchestrator.py \
            --consumers ${{ env.CONSUMER_NAME }} \
            --no-fail-fast

      - name: Run OpenSSL-specific tests
        run: |
          # Run OpenSSL validation
          python scripts/validation/validate-openssl-compatibility.py

          # Run consumer validation
          python scripts/validation/tier2-dependencies.py --consumer ${{ env.CONSUMER_NAME }}
          python scripts/validation/tier3-cross-consumer.py --consumer ${{ env.CONSUMER_NAME }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONSUMER_NAME }}-${{ matrix.package }}-${{ matrix.os }}
          path: |
            _Build/**/${{ matrix.package }}*.tar.gz
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.CONSUMER_NAME }}-${{ matrix.package }}-${{ matrix.os }}
          path: |
            test-results/
            *-results.json
          retention-days: 7

  # OpenSSL-specific security scanning
  security-scan-consumer:
    name: Security Scan OpenSSL
    needs: build-consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenSSL security validation
        run: |
          # FIPS compliance checking
          python scripts/validation/tier5-security.py --consumer ${{ env.CONSUMER_NAME }}

          # OpenSSL-specific security tests
          echo "🔐 Running OpenSSL FIPS validation..."

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ env.CONSUMER_NAME }}
          path: |
            security-results/
            *-scan-results.json
            fips-validation-results.json
          retention-days: 30

  # OpenSSL integration testing
  integration-test-consumer:
    name: Integration Test OpenSSL
    needs: [build-consumer, security-scan-consumer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run OpenSSL integration tests
        run: |
          # Run full integration test suite for OpenSSL
          python scripts/validation/tier4-integration.py --consumer ${{ env.CONSUMER_NAME }}

          # OpenSSL-specific integration tests
          echo "🔗 Testing OpenSSL cross-consumer integration..."

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ env.CONSUMER_NAME }}
          path: |
            integration-results/
            *-test-results.json
            openssl-integration-results.json
          retention-days: 7

  # OpenSSL deployment (only on main branch)
  deploy-consumer:
    name: Deploy OpenSSL Packages
    needs: [build-consumer, security-scan-consumer, integration-test-consumer]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-consumer.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.CONSUMER_NAME }}-*
          path: ./artifacts

      - name: Deploy to package registry
        run: |
          python scripts/ci-cd/artifact-uploader.py \
            --target cloudsmith \
            --artifacts-dir ./artifacts \
            --consumer ${{ env.CONSUMER_NAME }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Update deployment status
        run: |
          echo "🚀 OpenSSL deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ github.event.inputs.environment || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: Cloudsmith" >> $GITHUB_STEP_SUMMARY

  # OpenSSL status reporting
  consumer-report:
    name: OpenSSL Status Report
    needs: [validate-consumer, build-consumer, security-scan-consumer, integration-test-consumer, deploy-consumer]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate OpenSSL report
        run: |
          echo "## 🔐 OpenSSL Consumer CI/CD Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate-consumer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build-consumer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security-scan-consumer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration: ${{ needs.integration-test-consumer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy-consumer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ needs.validate-consumer.outputs.packages }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- FIPS 140-3 Compliance ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Provider Ordering ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Secure Build Pipeline ✅" >> $GITHUB_STEP_SUMMARY