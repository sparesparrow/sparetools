name: Monitor OpenSSL Upstream (Preconfigure)

on:
  schedule:
    # Run daily at 6 AM UTC to monitor upstream changes
    # Reduced from hourly to minimize workflow runs
    - cron: '0 6 * * *'
  push:
    branches:
      - main  # Only monitor on main branch, not PRs
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/README*'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force preconfiguration even if SHA unchanged'
        required: false
        type: boolean
        default: false
      targets:
        description: 'Configure targets (comma-separated: linux-x86_64,darwin64-arm64-cc,VC-WIN64A)'
        required: false
        default: 'linux-x86_64,darwin64-arm64-cc,VC-WIN64A'
      skip_commit:
        description: 'Skip committing SHA changes (for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  monitor-upstream:
    name: Monitor OpenSSL Upstream
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Required to commit SHA updates
      actions: read    # Required to trigger workflows
    outputs:
      sha_changed: ${{ steps.check-sha.outputs.sha_changed }}
      current_sha: ${{ steps.check-sha.outputs.current_sha }}
      targets: ${{ steps.parse-targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream SHA
        id: check-sha
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read current stored SHA
            const shaFile = '.github/upstream/openssl-master.sha';
            let storedSha = '0000000000000000000000000000000000000000';
            try {
              storedSha = fs.readFileSync(shaFile, 'utf8').trim();
            } catch (error) {
              console.log('SHA file not found, using default:', storedSha);
            }

            // Get current upstream SHA
            const response = await github.rest.repos.getBranch({
              owner: 'openssl',
              repo: 'openssl',
              branch: 'master'
            });

            const currentSha = response.data.commit.sha;
            const shaChanged = storedSha !== currentSha;

            console.log('Stored SHA:', storedSha);
            console.log('Current SHA:', currentSha);
            console.log('SHA changed:', shaChanged);

            // Write new SHA to file
            const shaDir = path.dirname(shaFile);
            if (!fs.existsSync(shaDir)) {
              fs.mkdirSync(shaDir, { recursive: true });
            }
            fs.writeFileSync(shaFile, currentSha + '\n');

            core.setOutput('sha_changed', shaChanged.toString());
            core.setOutput('current_sha', currentSha);

      - name: Parse targets
        id: parse-targets
        run: |
          # Default targets for upstream monitoring
          TARGETS="${{ github.event.inputs.targets || 'linux-x86_64,darwin64-arm64-cc,VC-WIN64A' }}"

          # Convert to JSON array for matrix
          TARGETS_JSON=$(echo "$TARGETS" | jq -R 'split(",") | map(. | sub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
          echo "targets=$TARGETS_JSON" >> $GITHUB_OUTPUT

          echo "Parsed targets: $TARGETS_JSON"

      - name: Commit SHA update
        if: steps.check-sha.outputs.sha_changed == 'true' && github.event.inputs.skip_commit != 'true'
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'GitHub Actions'
          author_email: 'actions@github.com'
          message: 'chore: update OpenSSL master branch SHA ${{ steps.check-sha.outputs.current_sha }}'
          add: '.github/upstream/openssl-master.sha'
          push: true

  preconfigure-linux-x86_64:
    name: Preconfigure (linux-x86_64)
    needs: monitor-upstream
    if: needs.monitor-upstream.outputs.sha_changed == 'true' || github.event.inputs.force_run == 'true'
    uses: ./.github/workflows/openssl-perl-preconfigure.yml
    with:
      openssl-repository: 'openssl/openssl'
      openssl-ref: 'master'
      configure-target: 'linux-x86_64'
      config-options: 'no-shared'
      make-depend: true
      artifact-name: 'openssl-upstream-master'
      use-cpython-tools: false
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  preconfigure-darwin64-arm64-cc:
    name: Preconfigure (darwin64-arm64-cc)
    needs: monitor-upstream
    if: needs.monitor-upstream.outputs.sha_changed == 'true' || github.event.inputs.force_run == 'true'
    uses: ./.github/workflows/openssl-perl-preconfigure.yml
    with:
      openssl-repository: 'openssl/openssl'
      openssl-ref: 'master'
      configure-target: 'darwin64-arm64-cc'
      config-options: 'no-shared'
      make-depend: true
      artifact-name: 'openssl-upstream-master'
      use-cpython-tools: false
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  preconfigure-VC-WIN64A:
    name: Preconfigure (VC-WIN64A)
    needs: monitor-upstream
    if: needs.monitor-upstream.outputs.sha_changed == 'true' || github.event.inputs.force_run == 'true'
    uses: ./.github/workflows/openssl-perl-preconfigure.yml
    with:
      openssl-repository: 'openssl/openssl'
      openssl-ref: 'master'
      configure-target: 'VC-WIN64A'
      config-options: 'no-shared'
      make-depend: true
      artifact-name: 'openssl-upstream-master'
      use-cpython-tools: false
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Summary
    needs: [monitor-upstream, preconfigure-linux-x86_64, preconfigure-darwin64-arm64-cc, preconfigure-VC-WIN64A]
    if: always() && (needs.monitor-upstream.outputs.sha_changed == 'true' || github.event.inputs.force_run == 'true')
    runs-on: ubuntu-22.04
    steps:
      - name: Generate summary
        run: |
          echo "# OpenSSL Upstream Preconfiguration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.monitor-upstream.outputs.sha_changed }}" == "true" ]; then
            echo "✅ **SHA Changed**: New upstream commit detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔄 **Forced Run**: Preconfiguration triggered manually" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: openssl/openssl" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: master" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ needs.monitor-upstream.outputs.current_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Targets: linux-x86_64, darwin64-arm64-cc, VC-WIN64A" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated Artifacts:**" >> $GITHUB_STEP_SUMMARY
          echo "- openssl-upstream-master-linux-x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- openssl-upstream-master-darwin64-arm64-cc" >> $GITHUB_STEP_SUMMARY
          echo "- openssl-upstream-master-VC-WIN64A" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download preconfigured bundles from workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Use bundles for local builds without Perl installation" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify configdata.pm generation in logs" >> $GITHUB_STEP_SUMMARY