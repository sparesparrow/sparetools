name: Build CPython Matrix (Zero-Copy)

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'CPython version'
        type: string
        default: '3.12.7'
      force_rebuild:
        description: 'Force rebuild (ignore cache)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'packages/sparetools-cpython/**'
      - '.github/workflows/build-cpython-matrix.yml'
    tags: ['cpython-v*']

env:
  CONAN_VERSION: "2.21.0"
  VERSION_BASE: "2.0.0"
  VERSION_CPYTHON: "3.12.7"
  PYTHON_VERSION: "3.12.7"  # Alias for backward compatibility

jobs:
  # Change detection
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'packages/sparetools-cpython/**'
              - '.github/workflows/build-cpython-matrix.yml'

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python
          
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # Build CPython matrix
  build-cpython:
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.source_changed == 'true' ||
      startsWith(github.ref, 'refs/tags/cpython-')
    
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64-gcc11
          - os: macos-latest
            platform: macos-x86_64
          - os: macos-14
            platform: macos-arm64
          # Windows build requires special handling
          # - os: windows-latest
          #   platform: windows-x86_64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python (for Conan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan --version
      
      - name: Configure Conan
        run: |
          conan profile detect --force
          conan remote add sparesparrow-conan \
            https://dl.cloudsmith.io/public/sparesparrow-conan/openssl-conan/conan/ \
            --force || true
        shell: bash
      
      - name: Cache Conan packages
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-cpython-${{ matrix.platform }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('packages/sparetools-cpython/**') }}
          restore-keys: |
            conan-cpython-${{ matrix.platform }}-${{ env.PYTHON_VERSION }}-
            conan-cpython-${{ matrix.platform }}-
      
      - name: Install Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libffi-dev \
            liblzma-dev \
            tk-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libgdbm-dev \
            uuid-dev
      
      - name: Install Build Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            openssl@3 \
            readline \
            sqlite3 \
            xz \
            zlib \
            tcl-tk \
            gdbm
      
      - name: Import sparetools-base
        run: |
          # Download from remote or export local
          conan download "sparetools-base/2.0.0" -r sparesparrow-conan || \
          conan export packages/sparetools-base --version=2.0.0
        shell: bash
      
      - name: Build CPython (Zero-Copy)
        run: |
          cd packages/sparetools-cpython
          
          # ✅ Conan 2.x syntax
          conan create . \
            --version=${{ inputs.python_version || env.PYTHON_VERSION }} \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=17
        shell: bash
      
      - name: Verify Zero-Copy Package
        run: |
          VERSION="${{ inputs.python_version || env.PYTHON_VERSION }}"
          
          # List package
          conan list "sparetools-cpython/$VERSION:*"
          
          # Get cache path
          PKG_PATH=$(conan cache path "sparetools-cpython/$VERSION:*" | head -1)
          echo "📦 Package cache path: $PKG_PATH"
          
          # Verify Python executable
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYTHON_EXE="$PKG_PATH/bin/python.exe"
          else
            PYTHON_EXE="$PKG_PATH/bin/python3"
          fi
          
          if [ -x "$PYTHON_EXE" ]; then
            echo "✅ Python executable found and is executable"
            "$PYTHON_EXE" --version
            "$PYTHON_EXE" -c "import sys; print(f'Platform: {sys.platform}')"
          else
            echo "❌ Python executable not found or not executable"
            ls -la "$PKG_PATH/bin/" || true
            exit 1
          fi
        shell: bash
      
      - name: Test Package Import
        run: |
          VERSION="${{ inputs.python_version || env.PYTHON_VERSION }}"
          PKG_PATH=$(conan cache path "sparetools-cpython/$VERSION:*" | head -1)
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYTHON_EXE="$PKG_PATH/bin/python.exe"
          else
            PYTHON_EXE="$PKG_PATH/bin/python3"
          fi
          
          # Test standard library imports
          "$PYTHON_EXE" -c "import ssl; print(f'SSL version: {ssl.OPENSSL_VERSION}')"
          "$PYTHON_EXE" -c "import sqlite3; print(f'SQLite version: {sqlite3.sqlite_version}')"
          "$PYTHON_EXE" -c "import zlib; print(f'zlib version: {zlib.ZLIB_VERSION}')"
        shell: bash
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ~/.conan2/p/spareto*cpython*/p
          format: cyclonedx-json
          output-file: sbom-cpython-${{ matrix.platform }}.json
      
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ~/.conan2/p/spareto*cpython*/p
          exit-code: '0'  # Don't fail on vulnerabilities (CPython itself)
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-cpython-${{ matrix.platform }}.sarif'
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cpython-${{ matrix.platform }}
          path: sbom-cpython-${{ matrix.platform }}.json
          retention-days: 90
      
      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-cpython-${{ matrix.platform }}
          path: trivy-cpython-${{ matrix.platform }}.sarif
          retention-days: 90
      
      - name: Upload to Cloudsmith
        if: |
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/cpython-') || github.ref == 'refs/heads/main')
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          pip install cloudsmith-cli
          
          VERSION="${{ inputs.python_version || env.PYTHON_VERSION }}"
          
          # ✅ Upload Conan package
          conan upload "sparetools-cpython/$VERSION:*" \
            -r sparesparrow-conan \
            --confirm
        shell: bash

  # Quality gate
  quality-gate:
    needs: [security-scan, build-cpython]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Results
        run: |
          echo "## 🎯 CPython Build Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-cpython.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build-cpython.result }}" == "success" ]]; then
            echo "✅ **GO** - CPython build passed"
            exit 0
          else
            echo "❌ **NO-GO** - CPython build failed"
            exit 1
          fi
