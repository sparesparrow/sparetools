name: ESP32 Quality Assurance

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.12'
        required: false
      bootstrap-script:
        description: 'Bootstrap script command'
        type: string
        default: 'python scripts/bootstrap.py'
        required: false
      run-static-analysis:
        description: 'Run static analysis'
        type: boolean
        default: true
        required: false
      coverage-enabled:
        description: 'Enable code coverage analysis'
        type: boolean
        default: true
        required: false
      coverage-threshold:
        description: 'Minimum coverage threshold percentage'
        type: string
        default: '80'
        required: false
      performance-baseline:
        description: 'Update performance baseline'
        type: boolean
        default: false
        required: false
      conan-profile:
        description: 'Conan profile for building'
        type: string
        default: 'esp32_base'
        required: false

env:
  SPARETOOLS_PROJECT_TYPE: embedded/esp32
  SPARETOOLS_PROJECT_NAME: nucleus-esp32
  COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}

jobs:
  code-quality:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Conan
      uses: turtlebrowser/get-conan@v1.2
      with:
        version: 2.21.0

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Bootstrap development environment
      run: ${{ inputs.bootstrap-script }}

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files --show-diff-on-failure

    - name: Run Python static analysis
      if: inputs.run-static-analysis
      run: |
        # Run mypy type checking
        python -m mypy . --ignore-missing-imports --no-error-summary || true

        # Run flake8 linting
        python -m flake8 . --max-line-length=120 --extend-ignore=E203,W503 || true

        # Run black format checking
        python -m black --check --diff . || true

    - name: Install C/C++ quality tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy clang-tools cppcheck pmccabe complexity

    - name: Run C/C++ code quality analysis
      run: |
        echo "Running C/C++ code quality analysis..."

        # Find all source files
        C_FILES=$(find . -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
                 grep -v -E "(build/|\.pio/|\.conan/|managed_components|CMakeFiles)" || true)

        if [ -n "$C_FILES" ]; then
          # Run complexity analysis
          echo "Running complexity analysis..."
          pmccabe $C_FILES > complexity-report.txt 2>/dev/null || true

          # Check for overly complex functions (McCabe > 10)
          COMPLEX_FUNCTIONS=$(grep -E " [0-9]{2,}" complexity-report.txt | wc -l 2>/dev/null || echo "0")
          if [ "$COMPLEX_FUNCTIONS" -gt 0 ]; then
            echo "⚠️  Found $COMPLEX_FUNCTIONS overly complex functions"
            echo "COMPLEXITY_ISSUES=1" >> $GITHUB_ENV
          fi

          # Run duplication detection (basic)
          echo "Running duplication detection..."
          # This is a simplified check - real duplication detection would use tools like PMD CPD
          find . -name "*.c" -o -name "*.cpp" | xargs wc -l | sort -nr > file-sizes.txt
          LARGE_FILES=$(grep -E " [0-9]{4,}" file-sizes.txt | wc -l 2>/dev/null || echo "0")
          if [ "$LARGE_FILES" -gt 0 ]; then
            echo "⚠️  Found $LARGE_FILES large files (>1000 lines) that may need refactoring"
          fi
        else
          echo "No C/C++ source files found for analysis"
        fi

    - name: Upload code quality results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-results
        path: |
          complexity-report.txt
          file-sizes.txt
        retention-days: 30

  coverage-analysis:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Conan and PlatformIO
      run: |
        # Install Conan
        pip install conan==2.21.0

        # Install PlatformIO
        curl -fsSL https://raw.githubusercontent.com/platformio/platformio-core-installer/master/get-platformio.py | python -

        # Setup PlatformIO
        echo "$HOME/.platformio/penv/bin" >> $GITHUB_PATH

    - name: Configure Conan
      run: |
        conan config set general.revisions_enabled=True
        conan profile detect --force

    - name: Install dependencies
      run: |
        conan install . --profile ${{ inputs.conan-profile }} --build=missing

    - name: Build with coverage instrumentation
      if: inputs.coverage-enabled
      run: |
        echo "Building with coverage instrumentation..."

        # Configure PlatformIO for coverage
        export PLATFORMIO_ENV=esp32dev
        export PLATFORMIO_BUILD_FLAGS="-fprofile-arcs -ftest-coverage -lgcov"

        # Build with coverage
        platformio run -e esp32dev --target build

    - name: Run tests with coverage
      if: inputs.coverage-enabled
      run: |
        echo "Running tests with coverage..."

        # Run unit tests (if available)
        if [ -d "test" ] && [ -f "platformio.ini" ]; then
          platformio test -e esp32dev || true  # Allow tests to fail for coverage collection
        fi

        # Generate coverage reports
        if command -v gcov &> /dev/null; then
          echo "Generating gcov coverage reports..."
          find . -name "*.gcda" -o -name "*.gcno" | xargs gcov || true
          lcov --capture --directory . --output-file coverage.info || true
          lcov --remove coverage.info '/usr/*' '*/.conan/*' '*/.pio/*' --output-file coverage.info || true
        fi

    - name: Generate coverage reports
      if: inputs.coverage-enabled
      run: |
        pip install coverage gcovr

        # Generate HTML coverage report
        gcovr --html --html-details --output coverage-report.html . || true

        # Generate JSON coverage report for upload
        gcovr --json coverage-report.json . || true

        # Calculate overall coverage percentage
        COVERAGE_PERCENT=$(gcovr --print-summary . | grep "lines:" | grep -o "[0-9]*\.[0-9]*%" | sed 's/%//' || echo "0")
        echo "COVERAGE_PERCENT=$COVERAGE_PERCENT" >> $GITHUB_ENV

        echo "Coverage: $COVERAGE_PERCENT%"

        # Check against threshold
        if (( $(echo "$COVERAGE_PERCENT < $COVERAGE_THRESHOLD" | bc -l 2>/dev/null || echo "1") )); then
          echo "❌ Coverage $COVERAGE_PERCENT% below threshold $COVERAGE_THRESHOLD%"
          echo "COVERAGE_BELOW_THRESHOLD=1" >> $GITHUB_ENV
        else
          echo "✅ Coverage $COVERAGE_PERCENT% meets threshold $COVERAGE_THRESHOLD%"
        fi

    - name: Upload coverage to Codecov
      if: inputs.coverage-enabled
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-report.json
        flags: esp32
        name: ESP32 Coverage
        fail_ci_if_error: false

    - name: Upload coverage reports
      if: inputs.coverage-enabled
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage-report.html
          coverage-report.json
          coverage.info
        retention-days: 30

    - name: Fail on low coverage
      if: inputs.coverage-enabled && env.COVERAGE_BELOW_THRESHOLD == '1'
      run: |
        echo "❌ Code coverage $COVERAGE_PERCENT% is below required threshold $COVERAGE_THRESHOLD%"
        exit 1

  performance-benchmarking:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup build environment
      run: |
        # Install PlatformIO
        curl -fsSL https://raw.githubusercontent.com/platformio/platformio-core-installer/master/get-platformio.py | python -
        echo "$HOME/.platformio/penv/bin" >> $GITHUB_PATH

        # Install benchmarking tools
        pip install pytest-benchmark

    - name: Build optimized firmware
      run: |
        echo "Building optimized firmware for benchmarking..."
        platformio run -e esp32dev --target build

    - name: Run performance benchmarks
      run: |
        echo "Running performance benchmarks..."

        # Check if custom benchmarks exist
        if [ -f "test/benchmark.py" ] || [ -d "benchmark" ]; then
          echo "Running custom benchmarks..."
          python -m pytest test/benchmark.py -v --benchmark-only || true
        else
          echo "No custom benchmarks found, running basic performance checks..."

          # Basic performance metrics from build
          if [ -f ".pio/build/esp32dev/firmware.bin" ]; then
            FIRMWARE_SIZE=$(stat -c%s .pio/build/esp32dev/firmware.bin)
            echo "Firmware Size: $FIRMWARE_SIZE bytes"

            # Check against baseline (if exists)
            if [ -f "performance-baseline.json" ]; then
              python -c "
import json
with open('performance-baseline.json') as f:
    baseline = json.load(f)

current_size = $FIRMWARE_SIZE
baseline_size = baseline.get('firmware_size', current_size)

if current_size > baseline_size * 1.1:  # 10% increase threshold
    print(f'❌ Firmware size increased by {(current_size/baseline_size - 1)*100:.1f}%')
    exit(1)
else:
    print(f'✅ Firmware size within acceptable range')
              "
            fi
          fi
        fi

    - name: Update performance baseline
      if: inputs.performance-baseline
      run: |
        echo "Updating performance baseline..."

        # Collect current metrics
        METRICS="{}"

        if [ -f ".pio/build/esp32dev/firmware.bin" ]; then
          SIZE=$(stat -c%s .pio/build/esp32dev/firmware.bin)
          METRICS=$(echo "$METRICS" | jq ".firmware_size = $SIZE")
        fi

        # Add timestamp
        METRICS=$(echo "$METRICS" | jq ".timestamp = \"$(date -Iseconds)\"")
        METRICS=$(echo "$METRICS" | jq ".commit = \"${{ github.sha }}\"")

        echo "$METRICS" > performance-baseline.json

    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          performance-baseline.json
          .benchmarks/
        retention-days: 30

  quality-summary:
    name: Quality Assurance Summary
    runs-on: ubuntu-latest
    needs: [code-quality, coverage-analysis, performance-benchmarking]
    if: always()

    steps:
    - name: Generate quality summary
      run: |
        echo "# ESP32 Quality Assurance Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Quality Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|---------------|--------|---------|" >> $GITHUB_STEP_SUMMARY

        echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} | Complexity, duplication, style |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Coverage | ${{ needs.coverage-analysis.result == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ env.COVERAGE_PERCENT }}% coverage |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance | ${{ needs.performance-benchmarking.result == 'success' && '✅ Passed' || '❌ Failed' }} | Benchmarks, regression detection |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- Python Version: ${{ inputs.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Static Analysis: ${{ inputs.run-static-analysis }}" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage Enabled: ${{ inputs.coverage-enabled }}" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage Threshold: ${{ inputs.coverage-threshold }}%" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Baseline: ${{ inputs.performance-baseline }}" >> $GITHUB_STEP_SUMMARY
        echo "- Conan Profile: ${{ inputs.conan-profile }}" >> $GITHUB_STEP_SUMMARY

        # Overall assessment
        OVERALL_STATUS="✅ All Quality Checks Passed"
        if [[ "${{ needs.code-quality.result }}" != "success" || \
              "${{ needs.coverage-analysis.result }}" != "success" || \
              "${{ needs.performance-benchmarking.result }}" != "success" ]]; then
          OVERALL_STATUS="❌ Quality Issues Found"
        fi

        echo "## $OVERALL_STATUS" >> $GITHUB_STEP_SUMMARY

        # Set final job status
        if [[ "$OVERALL_STATUS" == *"❌"* ]]; then
          exit 1
        fi