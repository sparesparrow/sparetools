# Continuous Screen Cast Configuration
# Configuration file for continuous screen casting with segmented video

[General]
# Screen cast directory
screen_cast_dir=/var/lib/minidlna/screen_cast

# Segment duration in seconds
segment_duration=30

# Maximum number of segments to keep
max_segments=3

# Video settings
video_width=1280
video_height=720
video_bitrate=2000k
video_preset=slow
video_profile=baseline
video_level=3.0
video_pixel_format=yuv420p

# Audio settings
audio_bitrate=128k
audio_codec=aac

# Frame rate
framerate=30

[DLNA]
# DLNA server settings
dlna_port=8200
dlna_friendly_name=Sparrow-Screen-Cast
dlna_presentation_url=http://$(hostname -I | awk '{print $1}'):8200/

# Auto-rescan after each segment
auto_rescan=true
rescan_delay=3

[Monitoring]
# Monitor refresh interval in seconds
monitor_interval=5

# Enable detailed logging
verbose_logging=false

# Log file location
log_file=/var/log/continuous_screen_cast.log

[Advanced]
# FFmpeg additional options
ffmpeg_extra_options=

# Segment cleanup options
cleanup_old_segments=true
cleanup_delay=10

# Error handling
max_retries=3
retry_delay=5

# Performance tuning
use_hardware_acceleration=false
thread_count=auto