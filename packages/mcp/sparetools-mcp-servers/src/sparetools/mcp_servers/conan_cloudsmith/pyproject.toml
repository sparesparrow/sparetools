[project]
name = "conan-cloudsmith-mcp-server"
version = "0.1.0"
description = "Conan & Cloudsmith MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "fastmcp>=2.0.0",
    "aiohttp>=3.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"