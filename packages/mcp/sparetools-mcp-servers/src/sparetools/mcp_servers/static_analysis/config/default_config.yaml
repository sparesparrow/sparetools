# Default Configuration for Enhanced Static Analysis MCP Server
# This configuration file contains all default settings for the development tooling server

# Server Configuration
server:
  name: "sparetools-mcp-static-analysis"
  version: "2.0.0"
  description: "Comprehensive development tooling MCP server with MCP-Prompts integration"

  # Timeout settings (in seconds)
  timeouts:
    analysis: 3600  # 1 hour for analysis operations
    session: 7200  # 2 hours for session timeout
    tool_discovery: 30  # 30 seconds for tool discovery
    mcp_client: 60  # 1 minute for MCP client operations

  # Resource limits
  limits:
    max_concurrent_sessions: 5
    max_output_size: 10485760  # 10MB
    max_log_lines: 5000
    max_workflow_steps: 20

# MCP-Prompts Integration
mcp_prompts:
  enabled: true
  server_url: "http://localhost:3000"
  api_key: null  # Set via environment variable MCP_PROMPTS_API_KEY
  timeout: 30
  cache_enabled: true
  health_check_interval: 60  # seconds

# Tool Registry Configuration
tool_registry:
  auto_discover: true
  discovery_timeout: 10
  cache_duration: 3600  # 1 hour

  # Tool-specific configurations
  tools:
    cppcheck:
      enabled: true
      executable: "cppcheck"
      default_args: ["--enable=all", "--xml", "--xml-version=2"]
      timeout: 600  # 10 minutes

    clang_tidy:
      enabled: true
      executable: "clang-tidy"
      timeout: 900  # 15 minutes
      requires_compile_commands: true

    valgrind:
      enabled: true
      executable: "valgrind"
      default_tool: "memcheck"
      timeout: 1800  # 30 minutes

    gdb:
      enabled: true
      executable: "gdb"
      timeout: 300  # 5 minutes

    strace:
      enabled: true
      executable: "strace"
      timeout: 600  # 10 minutes

    pytest:
      enabled: true
      executable: "python"
      args: ["-m", "pytest"]
      timeout: 600  # 10 minutes

    gtest:
      enabled: true
      timeout: 600  # 10 minutes

    jest:
      enabled: true
      executable: "npx"
      args: ["jest"]
      timeout: 600  # 10 minutes

    docker:
      enabled: true
      executable: "docker"
      timeout: 300  # 5 minutes

# Workflow Configuration
workflows:
  enabled: true
  max_concurrent_workflows: 3
  max_steps_per_workflow: 20
  persistence_enabled: true
  cleanup:
    enabled: true
    max_age_days: 30
    interval_hours: 24

# Session Management
sessions:
  persistence_enabled: true
  storage_path: "~/.mcp/sessions"
  cleanup:
    enabled: true
    max_age_days: 7
    interval_hours: 6

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "~/.mcp/logs/static_analysis.log"
    max_size: 10485760  # 10MB
    backup_count: 5

# Security Configuration
security:
  sandbox_enabled: true
  allowed_paths: []
  blocked_commands: []
  resource_limits:
    cpu_percent: 80
    memory_mb: 1024

# Project Profiles
project_profiles:
  default:
    severity_threshold: "medium"
    include_suggestions: true
    max_issues_per_tool: 100

  web:
    languages: ["javascript", "typescript"]
    tools: ["jest", "eslint"]
    severity_threshold: "high"

  python:
    languages: ["python"]
    tools: ["pytest", "pylint"]
    severity_threshold: "medium"

  cpp:
    languages: ["c", "c++"]
    tools: ["cppcheck", "clang-tidy", "valgrind"]
    severity_threshold: "high"

  library:
    severity_threshold: "high"
    include_performance: true
    max_issues_per_tool: 50

# Output Configuration
output:
  formats: ["json", "xml", "text", "markdown", "html"]
  default_format: "json"
  compression_enabled: false
  max_file_size: 10485760  # 10MB

# Performance Configuration
performance:
  caching_enabled: true
  cache_ttl: 3600  # 1 hour
  parallel_execution: true
  max_workers: 4

# Monitoring and Metrics
monitoring:
  enabled: true
  metrics_interval: 60  # seconds
  health_check_endpoint: "/health"
  metrics_endpoint: "/metrics"