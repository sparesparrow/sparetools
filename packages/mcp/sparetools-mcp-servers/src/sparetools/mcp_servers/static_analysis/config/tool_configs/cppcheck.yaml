# Cppcheck Tool Configuration
# Configuration for C/C++ static analysis with cppcheck

tool:
  name: "cppcheck"
  executable: "cppcheck"
  category: "static_analysis"
  language: "c++"

# Default command line arguments
default_args:
  - "--enable=all"
  - "--xml"
  - "--xml-version=2"
  - "--verbose"

# Severity levels and their mappings
severity_mapping:
  error: "high"
  warning: "medium"
  style: "low"
  performance: "medium"
  portability: "low"
  information: "info"

# Check categories to enable by default
enabled_checks:
  - "warning"
  - "style"
  - "performance"
  - "portability"
  - "information"

# Platform-specific settings
platforms:
  linux:
    install_command: "sudo apt-get install -y cppcheck"
    package_manager: "apt"

  macos:
    install_command: "brew install cppcheck"
    package_manager: "brew"

  windows:
    install_command: "choco install cppcheck"
    package_manager: "choco"

# Project type specific configurations
project_configs:
  embedded:
    enabled_checks:
      - "warning"
      - "style"
      - "performance"
    max_complexity: 10

  game:
    enabled_checks:
      - "warning"
      - "performance"
      - "portability"
    suppress_rules:
      - "unusedFunction"  # Games often have many entry points

  library:
    enabled_checks:
      - "all"
    strict_mode: true

# Output configuration
output:
  format: "xml"
  include_location: true
  include_severity: true
  max_issues: 1000

# Performance tuning
performance:
  jobs: 4  # Number of parallel jobs
  timeout: 600  # 10 minutes

# Rules and suppressions
suppressions:
  global: []
  per_file: {}
  per_directory: {}

# Custom rules (if supported by cppcheck version)
custom_rules: []