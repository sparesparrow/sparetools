[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-agent-multi-terminal-mcp-server"
version = "0.1.0"
description = "Multi-agent cursor environment MCP server for coordinated development workflows"
authors = [
    {name = "SpareTools Team"}
]
dependencies = [
    "mcp>=0.1.0",
    "terminator",
    "xdotool"
]
requires-python = ">=3.8"

[project.scripts]
cursor-agent-multi-terminal = "sparetools.mcp_servers.cursor_agent_multi_terminal.cursor_agent_multi_terminal_mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"