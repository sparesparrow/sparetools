# Telegram API Configuration Template
# Copy this file and fill in your actual values

telegram:
  # Get these from https://my.telegram.org/auth
  api_id: "your_api_id_here"
  api_hash: "your_api_hash_here"

  # Optional: Bot token from @BotFather (for bot mode)
  bot_token: "your_bot_token_here"

  # Optional: Phone number for user authentication (if not using bot token)
  phone: "+1234567890"

  # Session name for Telethon
  session_name: "mcp_transport_telegram"

# Polling configuration
polling:
  interval_seconds: 30
  max_message_age_seconds: 3600

# Rate limiting
rate_limiting:
  max_calls_per_minute: 30

# Media handling
media:
  max_file_size_mb: 50
  temp_directory: "/tmp/mcp_telegram_media"
  allowed_types: ["photo", "document", "audio", "video"]

# Logging
logging:
  level: "INFO"
  format: "json"  # or "text"
  file: null  # Set to a file path to enable file logging

# Webhook configuration (optional)
webhook:
  enabled: false
  url: "https://your-domain.com/webhook"
  secret: "your_webhook_secret"
  port: 8080