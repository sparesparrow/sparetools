; PlatformIO Configuration for NucleusESP32
; Enterprise-grade ESP32 firmware with Conan-PlatformIO bridge integration

[platformio]
default_envs = esp32s3_sunton
src_dir = src
include_dir = include
test_dir = test
build_cache_dir = .pio/cache
packages_dir = .pio/packages
platforms_dir = .pio/platforms
build_dir = .pio/build

; Global build configuration
[env]
framework = espidf
platform = espressif32
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 Sunton Display Configuration (Primary)
[env:esp32s3_sunton]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Conan-PlatformIO Bridge Configuration
extra_scripts = scripts/conan_pio_bridge.py
conan_profile = ../conan_profiles/esp32_sunton_v3.prof

; Build optimization and security flags
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -flto
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DCONFIG_MBEDTLS_HARDWARE_AES=1
    -DCONFIG_MBEDTLS_HARDWARE_MPI=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
    ; Sunton display specific
    -DUSER_SETUP_LOADED=1
    -DSunton_ESP32_2432S028=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32

; Linker flags for optimization
build_ldflags =
    -Wl,--gc-sections
    -flto
    -Wl,--print-memory-usage

; ESP32-S3 specific partitions for secure boot
board_build.secure_boot = true
board_build.flash_encryption = true
board_build.partitions = partitions_secure.csv

; Library dependencies (will be resolved by Conan)
lib_deps =
    lvgl/lvgl @ ^8.3.11
    ; Additional dependencies managed by Conan

; ESP32 standard configuration
[env:esp32]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

extra_scripts = scripts/conan_pio_bridge.py
conan_profile = ../conan_profiles/esp32_base.prof

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -flto
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_IDF_TARGET_ESP32=1

build_ldflags =
    -Wl,--gc-sections
    -flto
    -Wl,--print-memory-usage

; ESP32-C3 configuration
[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

extra_scripts = scripts/conan_pio_bridge.py
conan_profile = ../conan_profiles/esp32_base.prof

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -flto
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_IDF_TARGET_ESP32C3=1

build_ldflags =
    -Wl,--gc-sections
    -flto
    -Wl,--print-memory-usage

; ESP32-C6 configuration
[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

extra_scripts = scripts/conan_pio_bridge.py
conan_profile = ../conan_profiles/esp32_base.prof

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -flto
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_IDF_TARGET_ESP32C6=1

build_ldflags =
    -Wl,--gc-sections
    -flto
    -Wl,--print-memory-usage

; Debug configurations for development
[env:esp32s3_sunton_debug]
extends = env:esp32s3_sunton
build_type = debug

build_flags =
    ${env:esp32s3_sunton.build_flags}
    -O0
    -g3
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG=1

; Testing configuration
[env:test]
platform = native
framework =
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DPLATFORM_NATIVE

lib_deps =
    googletest/googletest @ ^1.14.0

; Custom build scripts and hooks
[scripts]
pre:scripts/pre_build.py
post:scripts/post_build.py

; Custom monitor filters for debugging
[monitor]
filters = esp32_exception_decoder, time

; Shared library configuration
[shared]
build_flags =
    -DPLATFORMIO=1
    -DSPARETOOLS_ECOSYSTEM=1
    -DNUCLEUS_ESP32=1